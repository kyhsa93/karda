<h1>카르다 전선 — 봇과 함께 싸우는 점령전</h1>
<p>카르다 전선은 브라우저에서 돌아가는 3D 전쟁 게임입니다. 연합군과 베로스 인민군(VPA)이 카르다 계곡의 거점을 놓고 싸우고, 플레이어는 진영을 골라 보병이나 탈것으로 출격합니다. 양쪽 병력은 봇이 맡아 전선의 흐름을 만들지만, 어느 거점이 넘어가는지는 플레이어가 바꿉니다. 서버 없이 혼자 하는 게임이라 가입이나 접속 대기가 없습니다.</p>
<h2>어떻게 하나요</h2>
<p>지금 할 수 있는 것은 하레크 계곡 맵의 빠른 점령전(거점 3곳)입니다. 진영(연합 또는 VPA), 난이도, 시간대(주간·해질녘)를 고르고, 배치 화면에서 역할과 출격 위치를 정합니다. 거점 원 안에 머물면 점령이 진행되고, 적이 함께 있으면 멈춥니다. 거점을 더 많이 가진 쪽이 상대 티켓을 깎고, 티켓이 먼저 바닥나는 쪽이 집니다. 죽으면 10초 뒤 다시 배치되며, 그동안에도 전장은 계속됩니다. 다른 경기 방식과 맵은 준비 중입니다.</p>
<p>역할은 둘입니다. 돌격병은 소총과 유탄으로 싸우고, 공격 헬기는 기관포·로켓·대전차 미사일을 싣고 계곡 위를 날며 지상을 지원합니다. 헬기는 지금 연합군만 탈 수 있고 VPA 헬기는 준비 중입니다. 헬기는 엔진 시동부터 직접 조종하며, 센서 화면을 켜면 제자리 호버를 유지합니다.</p>
<h2>조작</h2>
<ul>
<li>돌격병(키보드·마우스): WASD 이동, Shift 질주, Space 넘기, C 앉기, Z 엎드리기, 좌클릭 사격, 우클릭 조준, R 재장전, 1 소총, 2 유탄</li>
<li>공격 헬기(키보드·마우스): W/S 콜렉티브, 방향키 사이클릭, A/D 페달, 마우스로 고개 돌리기, Space 기관포, 1~4 무장 선택, T 센서 화면(자동 호버), L 레이저, F 플레어</li>
<li>터치: 왼쪽 스틱으로 이동(헬기는 콜렉티브·페달), 화면을 끌어 시점 변경, 화면의 발사·조준·재장전 버튼 사용</li>
<li>게임패드도 지원하며, 출격 화면의 조작 카드에 전체 조작이 나옵니다.</li>
</ul>
<h2>필요한 것</h2>
<p>3D 그래픽(WebGL)을 지원하는 최신 브라우저와, 컴퓨터라면 키보드와 마우스, 휴대폰·태블릿이라면 터치 화면이면 됩니다. 브라우저 메뉴의 "앱 설치" 또는 "홈 화면에 추가"로 설치하면 전체 화면으로 실행됩니다. 열 때마다 최신 버전을 네트워크에서 새로 받으므로 오프라인에서는 실행되지 않습니다. 이 게임은 자바스크립트가 있어야 실행됩니다.</p>
